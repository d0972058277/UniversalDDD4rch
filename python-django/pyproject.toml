[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-ddd-architecture-python"
version = "2.0.0"
description = "Universal DDD Architecture - Multi-package Python workspace"
authors = [
    {name = "Architecture Team", email = "architecture@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/architecture/universal-ddd-python"
Repository = "https://github.com/architecture/universal-ddd-python.git"
Issues = "https://github.com/architecture/universal-ddd-python/issues"

# Workspace configuration - lists all sub-packages
[tool.hatch.env]
requires = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "flake8>=6.0.0",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | old
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip_glob = ["old/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "7.4"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--ignore=architecture-core/tests/performance/test_repository_performance.py",
    "--ignore=architecture-django/tests/integration/test_django_repository.py",
]
pythonpath = [
    "architecture-core/src",
    "architecture-django/src",
    "architecture-shell-cqrs/src",
    ".",
]
testpaths = [
    "architecture-core/tests",
    "architecture-django/tests",
    "architecture-shell-cqrs/tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "architecture-core/src",
    "architecture-django/src",
    "architecture-shell-cqrs/src",
]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
